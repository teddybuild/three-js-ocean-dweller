<!doctype html>
<!-- Cloud tower sketch pad: paint a side view in metres (optionally over a traced photo), read the measurements,
     save JSON for fitting the tower shader (src/sky/clouds.js cloudDensityR). Serve with `pnpm dev`, open
     http://localhost:5173/tools/cloud-sketch.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Sketch</title>
<style>
  :root { --bg: #10151c; --panel: #18202a; --fg: #dce4ee; --dim: #8796a8; --acc: #6fb3ff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: flex; gap: 12px; padding: 12px; }
  #wrap { position: relative; width: 1000px; height: 700px; flex: none; background: #0b1016; border-radius: 6px; }
  canvas { display: block; border-radius: 6px; cursor: crosshair; }
  #bgimg, #paint, #grid { position: absolute; left: 0; top: 0; }
  #bgimg { pointer-events: none; opacity: 0.5; }
  #grid { pointer-events: none; }
  aside { width: 300px; background: var(--panel); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--dim); }
  input[type=range] { width: 150px; }
  button { background: #253244; color: var(--fg); border: 1px solid #34465e; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button.on { border-color: var(--acc); color: var(--acc); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  pre { margin: 0; white-space: pre-wrap; font: 12px/1.35 ui-monospace, monospace; color: var(--fg); }
  h1 { font-size: 15px; margin: 0; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bgimg" width="1000" height="700"></canvas>
  <canvas id="paint" width="1000" height="700"></canvas>
  <canvas id="grid" width="1000" height="700"></canvas>
</div>
<aside>
  <h1>Cloud sketch</h1>
  <div class="hint">Side view. Bottom line = cloud base. Left drag paints, right drag erases. Round brush = one puff.</div>
  <label>Brush radius <input id="brush" type="range" min="25" max="900" value="250"><span id="brushv"></span></label>
  <label>Canvas width (m) <input id="span" type="range" min="2000" max="16000" step="500" value="8000"><span id="spanv"></span></label>
  <div class="row">
    <button id="stamp">Stamp puffs</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
  </div>
  <label>Trace photo <input id="file" type="file" accept="image/*" style="width:150px"></label>
  <label>Photo opacity <input id="op" type="range" min="0" max="100" value="50"></label>
  <label>Name <input id="name" value="tower-1" style="width:150px"></label>
  <div class="row"><button id="save">Save JSON + PNG</button></div>
  <pre id="stats"></pre>
</aside>
<script>
const W = 1000, H = 700, BASE_Y = 640;  // px; the cloud base line
const paint = document.getElementById('paint'), pc = paint.getContext('2d', { willReadFrequently: true });
const grid = document.getElementById('grid'), gc = grid.getContext('2d');
const bg = document.getElementById('bgimg'), bc = bg.getContext('2d');
const $ = (id) => document.getElementById(id);
let mpp = 8;            // metres per pixel
let stamp = false, undoStack = [];

function drawGrid() {
  mpp = Number($('span').value) / W;
  $('spanv').textContent = $('span').value;
  $('brushv').textContent = $('brush').value + ' m';
  gc.clearRect(0, 0, W, H);
  gc.font = '11px system-ui'; gc.fillStyle = '#8796a8';
  const step = mpp * W > 8000 ? 1000 : 500;
  for (let m = 0; m * 1 <= (H) * mpp; m += step) {
    const y = BASE_Y - m / mpp;
    if (y < 0) break;
    gc.strokeStyle = m === 0 ? '#6fb3ff' : 'rgba(255,255,255,0.08)';
    gc.beginPath(); gc.moveTo(0, y); gc.lineTo(W, y); gc.stroke();
    gc.fillText(m + ' m', 4, y - 3);
  }
  for (let m = step; m < W * mpp; m += step) {
    const x = m / mpp;
    gc.strokeStyle = 'rgba(255,255,255,0.05)';
    gc.beginPath(); gc.moveTo(x, 0); gc.lineTo(x, BASE_Y); gc.stroke();
  }
}

function dot(x, y, erase) {
  const r = Number($('brush').value) / mpp;
  pc.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  pc.fillStyle = '#ffffff';
  pc.beginPath(); pc.arc(x, Math.min(y, BASE_Y), r, 0, Math.PI * 2); pc.fill();
  // nothing below the base line
  pc.globalCompositeOperation = 'destination-out';
  pc.fillRect(0, BASE_Y, W, H - BASE_Y);
  pc.globalCompositeOperation = 'source-over';
}

let down = null, last = null;
paint.addEventListener('contextmenu', (e) => e.preventDefault());
paint.addEventListener('pointerdown', (e) => {
  undoStack.push(pc.getImageData(0, 0, W, H)); if (undoStack.length > 40) undoStack.shift();
  down = e.button === 2 ? 'erase' : 'paint'; last = [e.offsetX, e.offsetY];
  dot(e.offsetX, e.offsetY, down === 'erase');
  if (stamp) down = null;
  paint.setPointerCapture(e.pointerId);
});
paint.addEventListener('pointermove', (e) => {
  if (!down) return;
  const [lx, ly] = last, dx = e.offsetX - lx, dy = e.offsetY - ly, n = Math.ceil(Math.hypot(dx, dy) / 3);
  for (let i = 1; i <= n; i++) dot(lx + dx * i / n, ly + dy * i / n, down === 'erase');
  last = [e.offsetX, e.offsetY];
});
addEventListener('pointerup', () => { if (down !== null || stamp) measure(); down = null; });

function mask() {
  const d = pc.getImageData(0, 0, W, H).data, m = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  return m;
}

// Euclidean-ish distance to the outside (two-pass chamfer 3-4), px
function distance(m) {
  const D = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) D[i] = m[i] ? 1e9 : 0;
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? 0 : D[y * W + x]);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!D[i]) continue;
    D[i] = Math.min(D[i], at(x - 1, y) + 3, at(x, y - 1) + 3, at(x - 1, y - 1) + 4, at(x + 1, y - 1) + 4);
  }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
    const i = y * W + x; if (!D[i]) continue;
    D[i] = Math.min(D[i], at(x + 1, y) + 3, at(x, y + 1) + 3, at(x + 1, y + 1) + 4, at(x - 1, y + 1) + 4);
  }
  for (let i = 0; i < W * H; i++) D[i] /= 3;
  return D;
}

function measure() {
  const m = mask();
  let top = BASE_Y, minX = W, maxX = 0, area = 0;
  for (let y = 0; y < BASE_Y; y++) for (let x = 0; x < W; x++) if (m[y * W + x]) { top = Math.min(top, y); minX = Math.min(minX, x); maxX = Math.max(maxX, x); area++; }
  if (!area) { $('stats').textContent = 'Paint a cloud.'; return null; }
  const height = (BASE_Y - top) * mpp;
  // width profile: filled metres per row, and the outer extent, at 20 levels from base to top
  const profile = [];
  for (let k = 0; k <= 20; k++) {
    const y = Math.round(BASE_Y - 1 - (BASE_Y - 1 - top) * k / 20);
    let filled = 0, l = -1, r = -1, cx = 0;
    for (let x = 0; x < W; x++) if (m[y * W + x]) { filled++; cx += x; if (l < 0) l = x; r = x; }
    profile.push({ hFrac: k / 20, h: Math.round((BASE_Y - y) * mpp), width: Math.round(filled * mpp), extent: l < 0 ? 0 : Math.round((r - l + 1) * mpp), centre: filled ? Math.round((cx / filled - (minX + maxX) / 2) * mpp) : 0 });
  }
  // lobes: local maxima of the distance field = centres of the round puffs; radius = distance (m)
  const D = distance(m), lobes = [];
  for (let y = 2; y < BASE_Y - 2; y += 2) for (let x = 2; x < W - 2; x += 2) {
    const v = D[y * W + x]; if (v < 3) continue;
    let peak = true;
    for (let dy = -4; dy <= 4 && peak; dy += 2) for (let dx = -4; dx <= 4; dx += 2) if ((dx || dy) && D[(y + dy) * W + x + dx] > v) { peak = false; break; }
    if (peak) lobes.push({ x: Math.round((x - minX) * mpp), h: Math.round((BASE_Y - y) * mpp), r: Math.round(v * mpp) });
  }
  // keep puffs that touch the outline (radius reaches within 15% of the surface), sorted by height
  const edge = lobes.filter((l) => l.r > 30).sort((a, b) => a.h - b.h);
  const rs = edge.map((l) => l.r).sort((a, b) => a - b), q = (f) => rs.length ? rs[Math.floor(f * (rs.length - 1))] : 0;
  // outline roughness: perimeter / perimeter of the convex-ish envelope (row extents)
  let perim = 0;
  for (let y = 1; y < BASE_Y; y++) for (let x = 1; x < W; x++) { const i = y * W + x; if (m[i] !== m[i - 1]) perim++; if (m[i] !== m[i - W]) perim++; }
  let envPerim = 0, prev = null;
  for (let y = top; y < BASE_Y; y++) {
    let l = -1, r = -1; for (let x = 0; x < W; x++) if (m[y * W + x]) { if (l < 0) l = x; r = x; }
    if (l < 0) continue; if (prev) envPerim += Math.abs(l - prev[0]) + Math.abs(r - prev[1]) + 2; else envPerim += r - l; prev = [l, r];
  }
  envPerim += prev ? prev[1] - prev[0] : 0;
  const base = Math.max(...profile.map((p) => p.width), 1);
  const stats = {
    name: $('name').value, metresPerPx: +mpp.toFixed(3),
    height_m: Math.round(height), maxWidth_m: Math.round((maxX - minX + 1) * mpp), baseWidth_m: profile[0].width,
    aspect_h_over_w: +(height / ((maxX - minX + 1) * mpp)).toFixed(2), area_km2: +(area * mpp * mpp / 1e6).toFixed(3),
    roughness: +(perim / Math.max(envPerim, 1)).toFixed(2),
    lobeRadius_m: { p25: q(0.25), median: q(0.5), p75: q(0.75), count: rs.length },
    profile, lobes: edge,
  };
  $('stats').textContent =
    `height ${stats.height_m} m   max width ${stats.maxWidth_m} m\n` +
    `aspect h/w ${stats.aspect_h_over_w}   roughness ${stats.roughness}\n` +
    `puff radius p25/median/p75 ${q(0.25)}/${q(0.5)}/${q(0.75)} m (${rs.length})\n\n` +
    `width vs height (fraction of the widest row)\n` +
    profile.filter((_, i) => i % 2 === 0).map((p) => `${String(Math.round(p.hFrac * 100)).padStart(3)}%  ${String(p.h).padStart(5)} m  ${(p.width / base).toFixed(2)}  ${'#'.repeat(Math.round(20 * p.width / base))}`).join('\n');
  return stats;
}

function save() {
  const s = measure(); if (!s) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(s, null, 1)], { type: 'application/json' }));
  a.download = `cloud-sketch-${s.name}.json`; a.click();
  const b = document.createElement('a'); b.href = paint.toDataURL('image/png'); b.download = `cloud-sketch-${s.name}.png`; b.click();
}

$('brush').oninput = drawGrid;
$('span').oninput = () => { drawGrid(); measure(); };
$('stamp').onclick = () => { stamp = !stamp; $('stamp').classList.toggle('on', stamp); };
$('undo').onclick = () => { const d = undoStack.pop(); if (d) { pc.putImageData(d, 0, 0); measure(); } };
$('clear').onclick = () => { undoStack.push(pc.getImageData(0, 0, W, H)); pc.clearRect(0, 0, W, H); measure(); };
$('op').oninput = () => { bg.style.opacity = $('op').value / 100; };
$('save').onclick = save;
$('file').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { bc.clearRect(0, 0, W, H); const s = Math.min(W / img.width, H / img.height); bc.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s); };
  img.src = URL.createObjectURL(f);
};
drawGrid(); measure();
window.sketch = { dot, measure };
</script>
</body>
</html>
